[project]
name = "Kairo"
version = "0.1.0"
description = "AWS-native platform for deploying, evaluating, training, and improving configured model-family LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.uv.workspace]
members = [
    "libs/kairo_common",
    "services/router",
    "services/safety_classifier",
    "services/eval_api",
    "ml",
]

[tool.uv.sources]
kairo-common = { workspace = true }
kairo-ml = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "asgi-lifespan>=2.1.0",
    "types-pyyaml>=6.0.0",
    "ministack>=1.4.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["infra", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PL"]
# PLC0415: lazy imports are deliberate here — optional deps (boto3, uvicorn,
# torch) must stay out of the default import path.
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "build/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "boto3", "boto3.*", "botocore.*",
    "torch", "torch.*", "transformers", "transformers.*",
    "peft", "peft.*", "trl", "trl.*", "accelerate", "accelerate.*",
    "datasets", "datasets.*", "mlflow", "mlflow.*",
    "sympy", "sympy.*", "opensearchpy", "opensearchpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "libs", "ml"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]
