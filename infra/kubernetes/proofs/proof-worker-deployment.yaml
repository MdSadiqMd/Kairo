apiVersion: apps/v1
kind: Deployment
metadata:
  name: proof-worker
  namespace: kairo
  labels:
    app.kubernetes.io/name: proof-worker
    app.kubernetes.io/component: proofs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proof-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proof-worker
    spec:
      serviceAccountName: proof-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof-worker
          image: 000000000000.dkr.ecr.us-west-2.amazonaws.com/kairo/proof-worker:latest
          command: ["python", "-m", "kairo_ml.proofs.worker"]
          envFrom:
            - configMapRef:
                name: kairo-rl-config
            - configMapRef:
                name: kairo-zk-config
                optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
