# ClusterSecretStore for AWS Secrets Manager — Secrets
# Manager everywhere; External Secrets Operator add-on. Auth is via IRSA:
# the external-secrets controller ServiceAccount assumes a role scoped to read
# the kairo-<env>-* secrets. No long-lived AWS keys anywhere.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
