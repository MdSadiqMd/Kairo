    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/kairo-dev-proof-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training-job
  namespace: kairo
  labels:
    app.kubernetes.io/part-of: Kairo
    app: training
  annotations:
    # Training job: read datasets, write checkpoints and model artifacts.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/kairo-dev-training-job
