# ServiceAccounts with IRSA role bindings.
# The role-arn annotation is a PLACEHOLDER: Terraform's `iam` module creates the
# per-service IRSA roles and qctl patches the real ARN at rollout time
# (account id 000000000000 and role names below are the naming contract).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: router
  namespace: kairo
  labels:
    app.kubernetes.io/part-of: Kairo
    app: router
  annotations:
    # Router: read model registry (DynamoDB), write events (Kinesis/SQS).
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/kairo-dev-router
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference
  namespace: kairo
  labels:
    app.kubernetes.io/part-of: Kairo
    app: vllm
  annotations:
    # Inference pod: read model artifacts from S3 only (least privilege).
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/kairo-dev-inference
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: safety-classifier
  namespace: kairo
  labels:
    app.kubernetes.io/part-of: Kairo
    app: safety-classifier
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/kairo-dev-safety-classifier
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval-runner
  namespace: kairo
  labels:
    app.kubernetes.io/part-of: Kairo
    app: eval-runner
  annotations:
    # Eval runner: read eval datasets, write eval results.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/kairo-dev-eval-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-ingestor
  namespace: kairo
  labels:
    app.kubernetes.io/part-of: Kairo
    app: log-ingestor
  annotations:
    # Log ingestor: write raw logs to S3, read KMS key.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/kairo-dev-log-ingestor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker
  namespace: kairo
  labels:
    app.kubernetes.io/part-of: Kairo
    app: agent-worker
  annotations:
    # Agent worker (agent phase): scoped tool permissions only.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/kairo-dev-agent-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proof-worker
  namespace: kairo
  labels:
    app.kubernetes.io/part-of: Kairo
    app: proof-worker
  annotations:
