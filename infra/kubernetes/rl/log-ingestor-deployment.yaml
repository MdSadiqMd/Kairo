# Log ingestor: consumes InferenceEvent records from
# the Kinesis stream and lands batched, gzipped, time-partitioned NDJSON in the
# S3 raw-events lake — the head of the data flywheel and the real-time RL reward
# pipeline. Stream/bucket/region are patched from Terraform outputs at
# rollout (module.eventing.kinesis_stream_name, module.s3_data_lake bucket).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kairo-rl-config
  namespace: kairo
data:
  AWS_REGION: us-west-2
  INGEST_PREFIX: raw-events
  INGEST_MAX_RECORDS: "1000"
  INGEST_FLUSH_INTERVAL: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-ingestor
  namespace: kairo
  labels:
    app.kubernetes.io/name: log-ingestor
    app.kubernetes.io/component: data-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: log-ingestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-ingestor
        app.kubernetes.io/component: data-plane
    spec:
      serviceAccountName: log-ingestor # IRSA: write raw-events, read KMS key
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: log-ingestor
          image: 000000000000.dkr.ecr.us-west-2.amazonaws.com/kairo/log-ingestor:latest
          envFrom:
            - configMapRef:
                name: kairo-rl-config
            - configMapRef:
                name: kairo-rl-env-config
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
