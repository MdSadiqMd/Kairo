# Reward aggregator: the on-policy half of the
# real-time RL loop. Periodically distills the implicit reward signal (accept/
# reject, edit persistence, follow-up dissatisfaction) from redacted events into
# scored training candidates, then the fast train -> per-cycle eval gate ->
# redeploy automation runs. Scaffolded as a CronJob; the training step and
# eval gate are gated behind the eval-runner (evals/eval-runner-job.yaml) so no
# ungated online weight update is ever possible.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reward-aggregator
  namespace: kairo
  labels:
    app.kubernetes.io/name: reward-aggregator
    app.kubernetes.io/component: training
spec:
  schedule: "*/30 * * * *" # every 30 min; the loop closes in hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reward-aggregator
        spec:
          restartPolicy: Never
          serviceAccountName: eval-runner # reads redacted events, writes candidates
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reward-aggregator
              image: 000000000000.dkr.ecr.us-west-2.amazonaws.com/kairo/eval-runner:latest
              command: ["python", "-m", "kairo_ml.rl.aggregate_rewards"]
              envFrom:
                - configMapRef:
                    name: kairo-rl-config
                - configMapRef:
                    name: kairo-rl-env-config
                    optional: true
                - configMapRef:
                    name: kairo-zk-config
                    optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
