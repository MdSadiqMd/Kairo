apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-aws-emulator-egress
  namespace: kairo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 4566
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-eval-runner-egress
  namespace: kairo
spec:
  podSelector:
    matchLabels:
      app: eval-runner
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: router
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-online-rl-training-egress
  namespace: kairo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: online-rl-trainer
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 4566
    - to:
        - podSelector:
            matchLabels:
              app: vllm
      ports:
        - protocol: TCP
          port: 8000
