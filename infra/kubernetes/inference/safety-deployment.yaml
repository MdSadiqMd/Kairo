# Safety classifier. The router calls this before routing
# with fail_open=false, so it MUST be running or every request is blocked —
# it is a hard dependency of the inference path, not optional. Stateless, cheap,
# CPU-scheduled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safety-classifier
  namespace: kairo
  labels:
    app.kubernetes.io/name: safety-classifier
    app.kubernetes.io/component: safety
    app: safety-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safety-classifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safety-classifier
        app.kubernetes.io/component: safety
        app: safety-classifier
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: safety-classifier
      nodeSelector:
        kubernetes.io/arch: amd64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: safety-classifier
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: safety-classifier
          image: 000000000000.dkr.ecr.us-west-2.amazonaws.com/kairo/safety:latest
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: safety-classifier
  namespace: kairo
  labels:
    app: safety-classifier
spec:
  selector:
    app: safety-classifier
  ports:
    - name: http
      port: 8080
      targetPort: http
