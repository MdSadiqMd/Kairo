# Cluster-internal Services — model servers are ClusterIP,
# never public. Service names match the in-cluster DNS in the model registry
# (model registry): vllm-<role>.kairo.svc.cluster.local:8000.
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: kairo
  labels:
    app.kubernetes.io/part-of: Kairo
    app: router
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
