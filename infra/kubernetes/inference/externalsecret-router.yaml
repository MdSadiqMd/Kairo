# Reconciles the router API-key secret from Secrets Manager into the k8s Secret
# the router mounts as a file. The Secrets Manager value
# `kairo-dev-api-key` is a JSON map {api_key: tenant_id} — exactly the shape the
# router's file-based Authenticator expects (services/router/.../auth.py).
# Overlays patch remoteRef.key per environment (kairo-<env>-api-key).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kairo-router-secrets
  namespace: kairo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: kairo-router-secrets
    creationPolicy: Owner
  data:
    - secretKey: api_keys.json
      remoteRef:
        key: kairo-dev-api-key
