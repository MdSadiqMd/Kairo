[project]
name = "kairo-eval-api"
version = "0.1.0"
description = "Eval registry and promotion-gate API"
requires-python = ">=3.11"
dependencies = [
    "kairo-common",
    "kairo-ml[aws]",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
kairo-eval-api = "eval_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_api"]
