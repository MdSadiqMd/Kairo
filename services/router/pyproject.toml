[project]
name = "kairo-router"
version = "0.1.0"
description = "OpenAI-compatible FastAPI router — the only public entry point"
requires-python = ">=3.11"
dependencies = [
    "kairo-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0"]

[project.scripts]
kairo-router = "router.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]
