[project]
name = "kairo-safety-classifier"
version = "0.1.0"
description = "Input/output/tool-action safety classifier service"
requires-python = ">=3.11"
dependencies = [
    "kairo-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "prometheus-client>=0.20.0",
]

[project.scripts]
kairo-safety = "safety_classifier.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_classifier"]
