[project]
name = "kairo-common"
version = "0.1.0"
description = "Shared primitives for Kairo services: config, logging, events, errors"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairo_common"]
