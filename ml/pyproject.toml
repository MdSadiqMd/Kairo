[project]
name = "kairo-ml"
version = "0.1.0"
description = "Eval runners, scorers, redaction, dataset/model manifests"
requires-python = ">=3.11"
dependencies = [
    "kairo-common",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "sympy>=1.13.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "trl>=0.11.0",
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
    "mlflow>=2.16.0",
    "bitsandbytes>=0.43.0",
]
rag = [
    "opensearch-py>=2.6.0",
]
aws = [
    "boto3>=1.34.0",
]

[project.scripts]
kairo-eval = "kairo_ml.evals.cli:main"
kairo-train = "kairo_ml.training.cli:main"
kairo-agent = "kairo_ml.agent_runtime.cli:main"
kairo-rlenv = "kairo_ml.rl_envs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairo_ml"]
