[workspace]
resolver = "2"
members = ["host"]
exclude = ["guests/reward", "guests/filter", "guests/grpo", "guests/gate"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
risc0-zkvm = "1.2"
risc0-build = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
